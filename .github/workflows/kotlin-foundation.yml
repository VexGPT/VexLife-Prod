name: Kotlin foundation

on:
  push:
    branches:
      - main
      - 'VXG-*'
  pull_request:

permissions:
  contents: read

jobs:
  kotlin-foundation:
    name: Kotlin 2.4.20 JVM + JS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify declared toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Compile and test portable + JVM source
        run: |
          ./gradlew --no-daemon jvmTest compileKotlinJs compileTestKotlinJs
