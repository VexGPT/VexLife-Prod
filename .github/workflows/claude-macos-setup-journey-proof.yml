# PROOF ROUTE ONLY (AGENTS.md: PROOF_ROUTE != ORDINARY_PRODUCT_ROUTE).
# Lives only on its own proof branch; never part of a product PR. Exercises the exact Setup Journey
# window source and the exact assembled private image on a real macOS host with disposable Homes.
name: claude-macos-setup-journey-proof
on:
  push:
    branches: [VXG-111326-claude-macos-proof-a001]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Host
        run: |
          echo "::notice title=host::macOS $(sw_vers -productVersion) / $(sysctl -n machdep.cpu.brand_string) / $(( $(sysctl -n hw.memsize) / 1073741824 )) GiB / $(uname -m)"
      - name: osacompile exact window source
        run: |
          /usr/bin/osacompile -o "$RUNNER_TEMP/Check.app" packaging/private-service-image/setup/vexlife-prod-setup-window.applescript
          echo "::notice title=osacompile::PASS exact window source compiled"
      - name: Setup slice tests on macOS
        run: ./gradlew --no-daemon jvmTest --tests 'vexlife.setup.*' --tests 'vexlife.home.*' --tests 'vexlife.entry.*' --tests 'vexlife.packaging.*'
      - name: Assemble exact private image
        run: ./gradlew --no-daemon assembleVexLifeProdServiceImage
      - name: Bind window like the bootstrap (no launch)
        run: |
          IMAGE="$(ls -d "$PWD"/build/vexlife-prod-service-image/images/*/ | head -1)"
          SHA="$(git rev-parse HEAD)"
          APP="$RUNNER_TEMP/VexLife Prod Setup.app"
          /usr/bin/osacompile -o "$APP" "$IMAGE/setup/vexlife-prod-setup-window.applescript"
          /usr/bin/plutil -replace CFBundleIdentifier -string com.vexlife.prod.setup "$APP/Contents/Info.plist"
          /usr/bin/plutil -insert LSMultipleInstancesProhibited -bool YES "$APP/Contents/Info.plist"
          /usr/bin/plutil -insert VexLifeProdExpectedSourceSha -string "$SHA" "$APP/Contents/Info.plist"
          /usr/bin/plutil -insert VexLifeProdSetupLauncher -string "$IMAGE/bin/vexlife-prod-setup" "$APP/Contents/Info.plist"
          /usr/bin/codesign --force --sign - "$APP"
          /usr/bin/codesign --verify --strict "$APP"
          echo "::notice title=bundle::PASS image window compiled, metadata bound, ad-hoc signed and verified"
      - name: Inspect disposable Homes and one held activation
        run: |
          IMAGE="$(ls -d "$PWD"/build/vexlife-prod-service-image/images/*/ | head -1)"
          SHA="$(git rev-parse HEAD)"
          L="$IMAGE/bin/vexlife-prod-setup"
          P="$RUNNER_TEMP/proof-homes"
          mkdir -p "$P/empty" "$P/withfiles"
          echo keep > "$P/withfiles/notes.txt"
          summarize() {
            python3 -c '
          import json,sys
          raw=sys.stdin.read()
          try:
              d=json.loads(raw)
          except Exception as e:
              print("UNPARSEABLE", repr(raw[:300])); sys.exit(0)
          c=d.get("card") or {}
          f=d.get("failure") or {}
          print("state=%s manifestation=%s failure=%s | %s | %s | buttons=%s" % (
              d.get("semanticStateRef"), d.get("manifestationRef"), f.get("failureRef"),
              c.get("title"), c.get("rail"), [b["label"] for b in c.get("buttons",[])]))
          '
          }
          inspect() {
            out="$("$L" --inspect-front-door --home "$2" --expected-source-sha "$SHA" 2>"$RUNNER_TEMP/$1.err")"; code=$?
            echo "::notice title=inspect $1::exit=$code $(printf '%s' "$out" | summarize)"
          }
          inspect absent "$P/absent"
          inspect empty "$P/empty"
          inspect with-files "$P/withfiles"
          inspect nested-missing "$P/a/b/Home"
          inspect tmp-link-parent "/tmp/vexlife-proof-home"
          out="$("$L" --activate-front-door-control FORM_HOME --home "$P/absent" --expected-source-sha "$SHA" 2>"$RUNNER_TEMP/act.err")"; code=$?
          echo "::notice title=activate FORM_HOME on held host::exit=$code $(printf '%s' "$out" | summarize) home_created=$(test -e "$P/absent" && echo yes || echo no) notes_intact=$(cat "$P/withfiles/notes.txt")"
          echo "::notice title=stderr sample::$(head -c 600 "$RUNNER_TEMP/absent.err" | tr '\n' ' ')"
