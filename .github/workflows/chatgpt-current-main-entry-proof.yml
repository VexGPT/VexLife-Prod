# PROOF ROUTE ONLY. This branch contains no Product-source change.
# The workflow is triggered from this proof branch but checks out the exact current main commit.
name: chatgpt-current-main-entry-proof

on:
  push:
    branches:
      - VXG-111426-chatgpt-current-main-entry-proof-a001

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VEXLIFE_PROD_MAIN_SHA: b8aa23954e3e12b0bb547b805f0262a2a15ab4ec
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VEXLIFE_PROD_MAIN_SHA }}
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Bind proof to exact main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VEXLIFE_PROD_MAIN_SHA"
          echo "PROOF main :: $(git rev-parse HEAD)"
          echo "PROOF host :: macOS $(sw_vers -productVersion) / $(sysctl -n machdep.cpu.brand_string) / $(( $(sysctl -n hw.memsize) / 1073741824 )) GiB / $(uname -m)"

      - name: Compile exact native Setup Journey window
        run: |
          set -euo pipefail
          /usr/bin/osacompile -o "$RUNNER_TEMP/VexLife-Prod-Setup.app" packaging/private-service-image/setup/vexlife-prod-setup-window.applescript
          /usr/bin/codesign --verify --strict "$RUNNER_TEMP/VexLife-Prod-Setup.app"
          echo "PROOF native-window :: PASS"

      - name: Current setup, service, packaging, and foundational source proof
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            jvmTest \
            --tests 'vexlife.setup.*' \
            --tests 'vexlife.service.*' \
            --tests 'vexlife.packaging.*' \
            --tests 'vexlife.foundational.*' \
            checkVexLifeStrings

      - name: Assemble exact current-main private image
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleVexLifeProdServiceImage
          IMAGE="$PWD/build/vexlife-prod-service-image/images/$VEXLIFE_PROD_MAIN_SHA"
          test -d "$IMAGE"
          test -x "$IMAGE/bin/vexlife-prod-setup"
          test -f "$IMAGE/setup/vexlife-prod-setup-window.applescript"
          test "$(plutil -extract sourceSha raw -o - "$IMAGE/service-image.json")" = "$VEXLIFE_PROD_MAIN_SHA"
          echo "PROOF private-image :: PASS $IMAGE"

      - name: Exercise exact setup launcher and language-first route on disposable Homes
        run: |
          set -euo pipefail
          IMAGE="$PWD/build/vexlife-prod-service-image/images/$VEXLIFE_PROD_MAIN_SHA"
          L="$IMAGE/bin/vexlife-prod-setup"
          P="$RUNNER_TEMP/vexlife-proof-homes"
          mkdir -p "$P/with-files"
          printf 'preserve-me\n' > "$P/with-files/notes.txt"

          "$L" --setup-language --home "$P/absent" --system-language ja-JP > "$RUNNER_TEMP/lang.json"
          python3 - "$RUNNER_TEMP/lang.json" <<'PY'
import json,sys
d=json.load(open(sys.argv[1]))
assert d["language"]=="ja"
assert d["effectsPerformed"] is False
assert d["window"]["setup.heading.choose-language"]
print("PROOF language-first :: PASS", d["language"], d["window"]["setup.heading.choose-language"])
PY

          "$L" --choose-language ko --home "$P/absent" > "$RUNNER_TEMP/chosen.json"
          test ! -e "$P/absent"
          python3 - "$RUNNER_TEMP/chosen.json" <<'PY'
import json,sys
d=json.load(open(sys.argv[1]))
assert d["language"]=="ko"
assert d["languageChosen"] is True
assert d["savedInHome"] is False
assert d["effectsPerformed"] is False
print("PROOF pre-Home language choice :: PASS")
PY

          "$L" --inspect-front-door --home "$P/absent" --expected-source-sha "$VEXLIFE_PROD_MAIN_SHA" --language en > "$RUNNER_TEMP/absent.json"
          "$L" --inspect-front-door --home "$P/with-files" --expected-source-sha "$VEXLIFE_PROD_MAIN_SHA" --language en > "$RUNNER_TEMP/with-files.json"
          python3 - "$RUNNER_TEMP/absent.json" "$RUNNER_TEMP/with-files.json" <<'PY'
import json,sys
a=json.load(open(sys.argv[1]))
w=json.load(open(sys.argv[2]))
assert a["effectsPerformed"] is False
assert w["effectsPerformed"] is False
assert w["semanticStateRef"]=="HOME_HELD"
print("PROOF no-effect front-door inspection :: PASS", a["semanticStateRef"], w["semanticStateRef"])
PY
          test "$(cat "$P/with-files/notes.txt")" = "preserve-me"

      - name: Exercise AppleScriptObjC JSON/null path against exact assembled launcher
        run: |
          set -euo pipefail
          IMAGE="$PWD/build/vexlife-prod-service-image/images/$VEXLIFE_PROD_MAIN_SHA"
          /usr/bin/osacompile -o "$RUNNER_TEMP/window.scpt" "$IMAGE/setup/vexlife-prod-setup-window.applescript"
          cat > "$RUNNER_TEMP/harness.applescript" <<'APPLESCRIPT'
use framework "Foundation"
use scripting additions
on run argv
    set windowScript to item 1 of argv
    set launcherPath to item 2 of argv
    set homePath to item 3 of argv
    set sourceSha to item 4 of argv
    set w to load script (windowScript as POSIX file)
    set setupLauncher of w to launcherPath
    set languageState to w's loadLanguage({"--setup-language", "--home", homePath, "--system-language", "ja-JP"})
    if languageState is missing value then error "loadLanguage returned missing value"
    set inspected to w's runProductEntry({"--inspect-front-door", "--home", homePath, "--expected-source-sha", sourceSha, "--language", "hi"}, false)
    set projection to jsonValue of inspected
    if projection is missing value then error "inspect produced no JSON"
    set card to projection's objectForKey:"card"
    set setupPlanText to w's dictionaryText(projection, "setupPlan", "<null handled>")
    set serviceShaText to w's dictionaryText(projection, "currentServiceSourceSha", "<null handled>")
    return "language=" & (selectedLanguage of w) & " setupPlan=" & setupPlanText & " serviceSha=" & serviceShaText & " title=" & (w's dictionaryText(card, "title", "?"))
end run
APPLESCRIPT
          /usr/bin/osacompile -o "$RUNNER_TEMP/harness.scpt" "$RUNNER_TEMP/harness.applescript"
          mkdir -p "$RUNNER_TEMP/harness-home-parent"
          /usr/bin/osascript "$RUNNER_TEMP/harness.scpt" "$RUNNER_TEMP/window.scpt" "$IMAGE/bin/vexlife-prod-setup" "$RUNNER_TEMP/harness-home-parent/absent" "$VEXLIFE_PROD_MAIN_SHA" | sed 's/^/PROOF AppleScriptObjC :: /'

      - name: Form and verify the current-main bootstrap artifact
        run: |
          set -euo pipefail
          ./gradlew --no-daemon archiveVexLifeProdServiceImage
          ROOT="$PWD/build/vexlife-prod-service-image/archives/$VEXLIFE_PROD_MAIN_SHA"
          CURRENT="$ROOT/vexlife-prod-bootstrap-darwin-arm64.command"
          DIGEST="$ROOT/vexlife-prod-bootstrap-darwin-arm64.command.sha256"
          test -x "$CURRENT"
          /bin/bash -n "$CURRENT"
          ! grep -Eq '@[A-Z0-9_]+@' "$CURRENT"
          grep -F "$VEXLIFE_PROD_MAIN_SHA" "$CURRENT" >/dev/null
          (cd "$ROOT" && /usr/bin/shasum -a 256 -c "$(basename "$DIGEST")")
          echo "PROOF current bootstrap :: PASS $CURRENT"
          echo "PROOF publication :: NOT PERFORMED; no GitHub Release currently exists"
