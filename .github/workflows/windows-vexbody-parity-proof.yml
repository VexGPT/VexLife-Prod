# Proof-only replay of the last known successful hosted Windows readiness run.
# This branch exists only to detect Windows regression against the current VexBody testing stack.
# Real Product/runtime usability still requires the separately owned lived Windows host path.
name: windows-vexbody-parity-proof

on:
  pull_request:
    paths:
      - 'src/commonMain/kotlin/vexlife/platform/**'
      - 'src/jvmMain/kotlin/vexlife/platform/windows/**'
      - 'src/commonTest/kotlin/vexlife/platform/**'
      - 'src/jvmTest/kotlin/vexlife/platform/windows/**'
      - '.github/workflows/windows-vexbody-parity-proof.yml'

permissions:
  contents: read

concurrency:
  group: windows-vexbody-parity-proof-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-readiness-replay:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure current-scale Kotlin compiler heap
        shell: pwsh
        run: |
          $GradleUserHome = Join-Path $env:RUNNER_TEMP 'vexlife-gradle'
          New-Item -ItemType Directory -Path $GradleUserHome -Force | Out-Null
          @'
          org.gradle.jvmargs=-Xmx4g
          kotlin.compiler.execution.strategy=in-process
          '@ | Set-Content -LiteralPath (Join-Path $GradleUserHome 'gradle.properties') -Encoding utf8
          "GRADLE_USER_HOME=$GradleUserHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Replay last successful Windows readiness proof
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon --max-workers=1 jvmTest `
            --tests "vexlife.platform.VexLifePlatformRealizationTest" `
            --tests "vexlife.platform.windows.VexLifeWindowsHostObservationTest" `
            --tests "vexlife.platform.windows.VexLifeWindowsReadinessTest"
