# Optional GitHub-hosted executor for the source-owned VexLife Pages formation.
# Billing-aware/default local route: tools/site/publish-gh-pages.sh through VexRelay/local Git.
# This workflow is manual-only and applies only while Settings -> Pages -> Source = GitHub Actions.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Form the exact static site
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/site/form-pages-site.sh "$PWD/_site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
