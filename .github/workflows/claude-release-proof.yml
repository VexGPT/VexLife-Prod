# PROOF ROUTE ONLY: the release workflow's build steps on a runner; publishes nothing.
# Builds VexLife for the Mac from main, and cuts stable versions when asked.
# Process and meaning: docs/release/RELEASES.md. This is the ordinary product release route; it
# publishes only what the Product's own Gradle tasks form (assemble + archive of the exact
# private service image and its source-bound bootstrap), at one exact commit.
name: claude-release-proof
on:
  push:
    branches: [VXG-111526-claude-release-proof-a001]
permissions:
  contents: read
concurrency:
  group: claude-release-proof
  cancel-in-progress: false
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      VERSION: '0.0.0-proof'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Admit the request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "PROOF ref :: $GITHUB_REF (proof branch; the product workflow admits main only)"
          if [ -n "$VERSION" ]; then
            echo "PROOF version check skipped for proof label $VERSION"
          fi
          echo "Host: macOS $(sw_vers -productVersion) / $(uname -m)"

      - name: Test
        run: ./gradlew --no-daemon jvmTest checkVexLifeStrings

      - name: Form the exact Mac image and bootstrap
        run: ./gradlew --no-daemon archiveVexLifeProdServiceImage

      - name: Publish the main build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          DIR="build/vexlife-prod-service-image/archives/$SHA"
          TAG="private-service-image-$SHA"
          ls -la "$DIR"
          {
            echo "Main build of \`$SHA\` for Mac (Apple silicon)."
            echo
            echo "Run the bootstrap with \`bash ~/Downloads/<file>.command\`; it verifies the exact image it downloads, then opens the VexLife setup window."
            echo
            echo "source-sha: $SHA"
            for file in "$DIR"/*.command; do
              echo "sha256 $(basename "$file") $(shasum -a 256 "$file" | awk '{print $1}')"
            done
          } > "$RUNNER_TEMP/main-notes.md"
          echo "PROOF would publish $TAG with:"; ls -la "$DIR"; echo "PROOF notes ::"; cat "$RUNNER_TEMP/main-notes.md"

      - name: Cut the stable version
        if: ${{ true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          DIR="build/vexlife-prod-service-image/archives/$SHA"
          {
            echo "VexLife $VERSION for Mac (Apple silicon), cut from main at \`$SHA\`."
            echo
            echo "Accepted feature threshold: see docs/release/RELEASES.md and the merged PRs since the previous version."
            echo
            echo "source-sha: $SHA"
            echo "image-release: private-service-image-$SHA"
            for file in "$DIR"/*.command; do
              echo "sha256 $(basename "$file") $(shasum -a 256 "$file" | awk '{print $1}')"
            done
          } > "$RUNNER_TEMP/stable-notes.md"
          echo "PROOF would cut v$VERSION with:"; ls "$DIR"/*.command "$DIR"/*.sha256; cat "$RUNNER_TEMP/stable-notes.md"

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Assemble the site exactly as pages.yml does (no deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          mkdir -p _site
          cp -R site/. _site/
          ./gradlew --no-daemon -q generateVexLifeSiteData -PvexlifeSiteDataDir="$PWD/_site/data" -PvexlifeSourceSha="$SHA"
          python3 .github/release/releases-snapshot.py --repository "$GITHUB_REPOSITORY" --main-sha "$SHA" --out _site/data/releases.json
          echo "PROOF site files ::"; find _site -type f | sort
          echo "PROOF releases.json ::"; head -c 600 _site/data/releases.json; echo
          echo "PROOF models.json ::"; python3 -c "import json; d=json.load(open('_site/data/models.json')); print([m['handle'] for m in d['models']], d['mac'])"
