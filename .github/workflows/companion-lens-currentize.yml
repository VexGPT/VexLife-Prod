name: companion-lens-currentize
on:
  push:
    branches:
      - VXG-112126-companion-engagement-bar-a001

permissions:
  contents: write

jobs:
  lens:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: VXG-112126-companion-engagement-bar-a001
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Give Product compiler bounded runner heap
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g' \
            'kotlin.daemon.jvmargs=-Xmx4g' \
            > "$HOME/.gradle/gradle.properties"
      - name: Generate and commit the exact Product Screen Lens consequence
        run: |
          set -euo pipefail
          ./gradlew --no-daemon generateVexLifeProdScreenLens
          git diff -- docs/lens/vexlife-prod.screen-lens.json
          if git diff --quiet -- docs/lens/vexlife-prod.screen-lens.json; then
            echo "Screen Lens already current."
            exit 0
          fi
          git config user.name "VexLife Product Proof"
          git config user.email "actions@users.noreply.github.com"
          git add docs/lens/vexlife-prod.screen-lens.json
          git commit -m "[Screen Lens] Currentize Companion engagement presentation"
          git push origin HEAD:VXG-112126-companion-engagement-bar-a001
