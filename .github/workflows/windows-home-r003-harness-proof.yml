# Temporary sanity execution for R003 against a synthetic Home fixture.
# Proves harness behavior only; does not validate Victor's Home identity.
name: windows-home-r003-harness-proof

on:
  pull_request:
    paths:
      - 'relay/windows-product-baseline/home/R003/**'
      - '.github/workflows/windows-home-r003-harness-proof.yml'

permissions:
  contents: read

jobs:
  harness:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Form synthetic Home fixture
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP '.vexlife'
          New-Item -ItemType Directory -Force -Path (Join-Path $h 'config'), (Join-Path $h 'devices'), (Join-Path $h 'runtime\vexlife-prod'), (Join-Path $h 'recovery') | Out-Null
          '{"schemaVersion":"vexlife.home/v0","currentDeviceRef":"device.vexlife.synthetic","homeRef":"vex-home.device.vexlife.synthetic"}' | Set-Content -LiteralPath (Join-Path $h 'config\home.json') -Encoding UTF8
          '{"schemaVersion":"vexlife.device-installation/v0","deviceRef":"device.vexlife.synthetic"}' | Set-Content -LiteralPath (Join-Path $h 'devices\device.vexlife.synthetic.json') -Encoding UTF8
          '{"schemaVersion":"vexlife.model-configuration/v0","state":"UNCONFIGURED"}' | Set-Content -LiteralPath (Join-Path $h 'config\model.json') -Encoding UTF8
          '{"schemaVersion":"vexlife-prod.runtime-model-binding/v1","state":"UNCONFIGURED"}' | Set-Content -LiteralPath (Join-Path $h 'runtime\vexlife-prod\model-binding.json') -Encoding UTF8
          '{"schemaVersion":"vexlife.bootstrap-receipt/v0"}' | Set-Content -LiteralPath (Join-Path $h 'recovery\bootstrap-receipt.json') -Encoding UTF8
          'SYNTHETIC_HOME=' + $h | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Execute R003 no-effect evidence harness
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'r003-output'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & '.\relay\windows-product-baseline\home\R003\RUN-VEXLIFE-WINDOWS-HOME-EVIDENCE.ps1' -ProposedHome $env:SYNTHETIC_HOME -OutputDirectory $out
          $return = Get-ChildItem -LiteralPath $out -Filter 'RETURN-VEXLIFE-WINDOWS-HOME-EVIDENCE-R003--sha256-*.zip' -File | Select-Object -First 1
          if ($null -eq $return) { throw 'R003_RETURN_NOT_FORMED' }
          Write-Host ('R003 hosted harness PASS: ' + $return.Name)
