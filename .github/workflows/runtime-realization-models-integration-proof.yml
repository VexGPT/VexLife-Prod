# Temporary integration proof: PR #243 + current-main PR #246.
# This workflow does not make either PR the other's source owner; remove after proof.
name: runtime-realization-models-integration-proof
on:
  push:
    branches:
      - VXG-111726-chatgpt-windows-runtime-realization-a001
permissions:
  contents: read
concurrency:
  group: runtime-realization-models-integration-proof
  cancel-in-progress: true
jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compose current #243 with exact #246 in runner workspace
        shell: pwsh
        run: |
          git config user.name "VexLife proof"
          git config user.email "proof@vexlife.invalid"
          git fetch --no-tags --depth=1 origin 76fcab19f2ea45d56b65aebd8594d630004da96d
          git merge --no-commit --no-ff FETCH_HEAD
          git status --short
      - name: Prove target-neutral realization + Models/configuration coexistence
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon --max-workers=1 checkVexLifeStrings jvmTest `
            --tests "vexlife.platform.VexLifePlatformRealizationTest" `
            --tests "vexlife.platform.windows.VexLifeWindowsHostObservationTest" `
            --tests "vexlife.platform.windows.VexLifeWindowsReadinessTest" `
            --tests "vexlife.model.heretic.HereticRuntimeRealizationTest" `
            --tests "vexlife.platform.windows.VexLifeWindowsRuntimeMaterializationTest" `
            --tests "vexlife.platform.windows.VexLifeWindowsHereticRuntimeTest" `
            --tests "vexlife.model.VexLifeModelsFamilyTest" `
            --tests "vexlife.model.heretic.HereticRuntimeConfigurationTest" `
            --tests "vexlife.model.VexLifeModelsTest" `
            --tests "vexlife.model.heretic.runtime.FileHereticRuntimeConfigurationStoreTest" `
            --tests "vexlife.model.heretic.runtime.HereticPersistentRuntimeTest"
