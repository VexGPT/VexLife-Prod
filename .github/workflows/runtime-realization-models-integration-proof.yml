    branches:
      - VXG-111726-chatgpt-windows-runtime-realization-a001
permissions:
  contents: read
concurrency:
  group: models-runtime-baseline-proof
  cancel-in-progress: true
jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 76fcab19f2ea45d56b65aebd8594d630004da96d
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run exact PR246 persistent-runtime tests alone
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon --max-workers=1 jvmTest `
