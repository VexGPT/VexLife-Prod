# Optional GitHub-hosted executor for the source-owned VexLife release process.
# VexRelay/local macOS execution can run tools/release/publish-mac-release.sh directly instead.
name: release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: 'What do you want to publish?'
        required: true
        type: choice
        options:
          - preview
          - stable
        default: preview
      version:
        description: 'Stable only: version like 0.1.0. Leave empty for a preview.'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Publish the exact VexLife cutoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            bash tools/release/publish-mac-release.sh preview "" "$GITHUB_SHA"

            # The Preview is bound to the push SHA. The catalog, however, should always project
            # the newest current main after queued releases finish. Retry only this read/current-main
            # projection when main advances between fetch and the source-owned Pages admission check.
            pages_published=false
            for attempt in 1 2 3; do
              git fetch --quiet origin main
              git checkout --quiet --detach refs/remotes/origin/main
              if VEXLIFE_REPOSITORY="VexGPT/VexLife-Prod" bash tools/site/publish-gh-pages.sh; then
                pages_published=true
                break
              fi
            done
            [ "$pages_published" = true ] || {
              echo "Automatic Preview published, but current-main Pages projection did not converge." >&2
              exit 1
            }
          else
            bash tools/release/publish-mac-release.sh "${{ inputs.channel }}" "${{ inputs.version }}"
          fi
