name: mac-runtime-signature-and-compat-probe-a002
on:
  push:
    branches:
      - VXG-112026-mac-quarantine-copy-probe-a001
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact prior Preview and accepted-main runtime identity
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/runtime-probe"
          mkdir -p "$ROOT"

          PRIOR_SHA="d2b241b903e34e0e14b3c561ffcfa77ae367662a"
          curl -fL --retry 3             "https://github.com/VexGPT/VexLife-Prod/releases/download/private-service-image-$PRIOR_SHA/vexlife-prod-service-image-darwin-arm64-$PRIOR_SHA.tar.gz"             -o "$ROOT/prior.tar.gz"
          mkdir -p "$ROOT/prior"
          tar -xzf "$ROOT/prior.tar.gz" -C "$ROOT/prior"

          gh api             -H "Accept: application/vnd.github+json"             "/repos/VexGPT/VexLife-Prod/actions/artifacts/14611226856/zip"             > "$ROOT/main-artifact.zip"
          ditto -x -k "$ROOT/main-artifact.zip" "$ROOT/main-artifact"
          MAIN_DMG="$ROOT/main-artifact/VexLife-macOS-AppleSilicon.dmg"
          test -f "$MAIN_DMG"

          MOUNT="$ROOT/main-mount"
          mkdir -p "$MOUNT"
          hdiutil attach "$MAIN_DMG" -readonly -nobrowse -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          MAIN_IMAGE="$MOUNT/VexLife.app/Contents/Resources/private-service-image"

          python3 - "$ROOT/prior/service-image.json" "$MAIN_IMAGE/service-image.json" <<'PY'
          import json, sys
          prior=json.load(open(sys.argv[1]))
          main=json.load(open(sys.argv[2]))
          for name, obj in [("D2B",prior),("MAIN146B",main)]:
              print(name+"_SOURCE="+obj["sourceSha"])
              print(name+"_JAVA_MAJOR="+str(obj["javaRuntimeMajor"]))
              print(name+"_MODULES="+",".join(obj["runtimeModules"]))
              print(name+"_PAYLOAD="+obj["payloadSha256"])
          p=set(prior["runtimeModules"]); m=set(main["runtimeModules"])
          print("D2B_MISSING_FOR_MAIN146B="+",".join(sorted(m-p)))
          print("D2B_SUPERSET_MAIN146B="+str(m.issubset(p)).lower())
          PY

          echo "=== OUTER APP SIGNATURE ==="
          /usr/bin/codesign -d --verbose=4 "$MOUNT/VexLife.app" 2>&1 || true
          echo "=== NESTED JAVA SIGNATURE ==="
          /usr/bin/codesign -d --verbose=4 "$MAIN_IMAGE/runtime/bin/java" 2>&1 || true
          echo "=== NESTED JAVA VERIFY ==="
          /usr/bin/codesign --verify --strict --verbose=4 "$MAIN_IMAGE/runtime/bin/java" 2>&1 || true
          echo "=== OUTER DEEP VERIFY ==="
          /usr/bin/codesign --verify --deep --strict --verbose=4 "$MOUNT/VexLife.app" 2>&1 || true
          echo "=== JAVA FILE TYPE ==="
          /usr/bin/file "$MAIN_IMAGE/runtime/bin/java"

          hdiutil detach "$MOUNT"
          trap - EXIT
