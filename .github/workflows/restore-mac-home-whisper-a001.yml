name: restore-mac-home-whisper-a001
on:
  push:
    branches:
      - VXG-112026-chatgpt-restore-mac-home-whisper-a001
permissions:
  contents: read
concurrency:
  group: restore-mac-home-whisper-a001
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 20f86564d7ce7c19eaa052c1da790e280d64c691
      - name: Verify exact restoration candidate
        run: test "$(git rev-parse HEAD)" = "20f86564d7ce7c19eaa052c1da790e280d64c691"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bound Gradle and Kotlin compiler memory
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
          kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
          org.gradle.workers.max=1
          EOF
      - name: Focused Mac Home-provider restoration proof
        run: ./gradlew --no-daemon jvmTest --tests vexlife.localasr.VexLifeLocalAsrMacHomeRestorationTest
      - name: Repository JVM and strings proof
        run: ./gradlew --no-daemon jvmTest checkVexLifeStrings
      - name: Form and verify restoration DMG
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -PvexlifeAppVersion=0.0.0 archiveVexLifeProdMacApplication
          SHA="$(git rev-parse HEAD)"
          APP_DIR="build/vexlife-prod-mac-application/$SHA"
          test -f "$APP_DIR/VexLife-macOS-AppleSilicon.dmg"
          test -f "$APP_DIR/VexLife-macOS-AppleSilicon.dmg.sha256"
          test -f "$APP_DIR/VexLife-macOS-AppleSilicon.receipt.json"
          (cd "$APP_DIR" && shasum -a 256 -c "VexLife-macOS-AppleSilicon.dmg.sha256")
          /usr/bin/hdiutil verify "$APP_DIR/VexLife-macOS-AppleSilicon.dmg"
          MOUNT="$RUNNER_TEMP/vexlife-dmg"
          mkdir -p "$MOUNT"
          /usr/bin/hdiutil attach "$APP_DIR/VexLife-macOS-AppleSilicon.dmg" -readonly -nobrowse -mountpoint "$MOUNT"
          trap '/usr/bin/hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          /usr/bin/plutil -extract VexLifeProdExpectedSourceSha raw -o - "$MOUNT/VexLife.app/Contents/Info.plist" | grep -Fx '20f86564d7ce7c19eaa052c1da790e280d64c691'
          test -x "$MOUNT/VexLife.app/Contents/Resources/private-service-image/local-asr-provider/whispercpp/v1.9.5/bin/whisper-server"
          /usr/bin/hdiutil detach "$MOUNT"
          trap - EXIT
          cat "$APP_DIR/VexLife-macOS-AppleSilicon.receipt.json"
      - name: Retain restoration DMG
        uses: actions/upload-artifact@v4
        with:
          name: vexlife-mac-home-whisper-restoration-20f86564d7ce7c19eaa052c1da790e280d64c691
          if-no-files-found: error
          path: |
            build/vexlife-prod-mac-application/20f86564d7ce7c19eaa052c1da790e280d64c691/VexLife-macOS-AppleSilicon.dmg
            build/vexlife-prod-mac-application/20f86564d7ce7c19eaa052c1da790e280d64c691/VexLife-macOS-AppleSilicon.dmg.sha256
            build/vexlife-prod-mac-application/20f86564d7ce7c19eaa052c1da790e280d64c691/VexLife-macOS-AppleSilicon.receipt.json

# Registered workflow trigger.
