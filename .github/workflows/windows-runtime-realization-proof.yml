# Temporary source-proof executor for PR #243.
# Remove after the exact head is proven; this is not a permanent Product workflow.
name: windows-runtime-realization-proof
on:
  push:
    branches:
      - VXG-111726-chatgpt-windows-runtime-realization-a001
permissions:
  contents: read
concurrency:
  group: windows-runtime-realization-proof
  cancel-in-progress: true
jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run focused platform/runtime realization proof
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon --max-workers=1 jvmTest `
            --tests "vexlife.platform.VexLifePlatformRealizationTest" `
            --tests "vexlife.platform.windows.VexLifeWindowsHostObservationTest" `
            --tests "vexlife.platform.windows.VexLifeWindowsReadinessTest" `
            --tests "vexlife.model.heretic.HereticRuntimeRealizationTest" `
            --tests "vexlife.platform.windows.VexLifeWindowsRuntimeMaterializationTest" `
            --tests "vexlife.platform.windows.VexLifeWindowsHereticRuntimeTest"
